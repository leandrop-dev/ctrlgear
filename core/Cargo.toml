[package]
name = "ctrlgear-core"
description = "Device protocol and HID logic for managing SteelSeries hardware"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "ctrlgear_core"
path = "src/lib.rs"

[dependencies]
hidapi = "2.6"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
mockall = "0.13"
