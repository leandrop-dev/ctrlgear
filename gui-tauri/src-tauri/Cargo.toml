[package]
name = "gui-tauri"
description = "Desktop GUI for CtrlGear (Tauri, in development)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gui_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "ctrlgear-tauri-dev"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlgear-core = { path = "../../core", features = ["specta"] }
dirs = "7.0.0"
hidapi = "2.6"
notify-rust = "4.18.0"
pipewire = "0.10"
toml = "1.1.6"
tokio = { version = "1", features = ["sync", "time"] }
specta = { version = "2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-mcp-bridge = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
