[package]
name = "steelctl-cli"
description = "Command-line interface for managing SteelSeries hardware"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "steelctl-cli"
path = "src/main.rs"

[dependencies]
steelctl-core = { path = "../core" }
hidapi = "2.6"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
