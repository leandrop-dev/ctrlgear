[package]
name = "ctrlgear-gui"
description = "Desktop GUI for managing SteelSeries hardware"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "ctrlgear"
path = "src/main.rs"

[dependencies]
ctrlgear-core = { path = "../core" }
dirs = "7.0.0"
hidapi = "2.6"
notify-rust = "4.18.0"
serde = { version = "1.0.229", features = ["derive"] }
slint = "1.17.1"
toml = "1.1.6"

[build-dependencies]
slint-build = "1.17.1"
